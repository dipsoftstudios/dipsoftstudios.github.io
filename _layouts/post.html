---
layout: default
---
<article class="blog-post wrap">
  <a class="blog-back" href="{{ '/blog/' | relative_url }}">← All articles</a>
  <header class="blog-post-header">
    <p class="eyebrow"><i></i> {{ page.date | date: "%B %-d, %Y" }}</p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p>{{ page.description | escape }}</p>{% endif %}
  </header>
  <div class="blog-prose">{{ content }}</div>
</article>
